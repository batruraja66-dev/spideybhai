<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROFIT BY SPIDEY – Telegram Community</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--pink:#ff4fb3;--purple:#8b45ff}
    html{scroll-behavior:smooth}
    body{
      font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;
      color:#fff;padding:18px;overflow-x:hidden;position:relative;
      background:radial-gradient(circle at 15% 15%,rgba(255,79,179,.22),transparent 28%),
                 radial-gradient(circle at 90% 80%,rgba(125,44,255,.18),transparent 30%),
                 linear-gradient(145deg,#120411,#09020d 55%,#16051a)
    }
    body:before,body:after{content:"";position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(70px);
      opacity:.22;pointer-events:none;animation:orb 8s ease-in-out infinite alternate}
    body:before{background:#ff2fa9;left:-110px;top:8%}
    body:after{background:#8b35ff;right:-120px;bottom:5%;animation-delay:-4s}
    @keyframes orb{to{transform:translate(25px,-20px) scale(1.12)}}

    .container{
      max-width:440px;width:100%;position:relative;overflow:hidden;text-align:center;padding:30px 22px 25px;
      border-radius:30px;border:1px solid rgba(255,117,203,.48);
      background:linear-gradient(145deg,rgba(50,9,42,.88),rgba(18,4,19,.94));
      box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 70px rgba(255,52,170,.1),inset 0 1px 0 rgba(255,255,255,.1);
      backdrop-filter:blur(22px);animation:cardIn .75s cubic-bezier(.2,.8,.2,1)
    }
    .container:before{content:"";position:absolute;inset:-2px;border-radius:32px;padding:1px;
      background:linear-gradient(135deg,rgba(255,115,201,.9),transparent 35%,transparent 65%,rgba(145,64,255,.7));
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;animation:borderGlow 4s linear infinite}
    .container:after{content:"✦  ·  ✧  ·  ✦  ·  ✧";position:absolute;top:12px;left:0;right:0;
      color:rgba(255,125,207,.18);font-size:13px;letter-spacing:12px;pointer-events:none;animation:sparkle 3s ease-in-out infinite}
    @keyframes cardIn{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes borderGlow{50%{opacity:1}}
    @keyframes sparkle{50%{opacity:.45;transform:translateY(4px)}}

    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;margin-bottom:18px;border-radius:999px;
      color:#ffd8ef;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
      background:rgba(255,71,176,.1);border:1px solid rgba(255,115,198,.3);
      box-shadow:inset 0 0 18px rgba(255,65,176,.07),0 0 20px rgba(255,65,176,.08);animation:badgePulse 2.6s ease-in-out infinite}
    .badge:before{content:"";width:7px;height:7px;border-radius:50%;background:#62ffbd;box-shadow:0 0 12px #62ffbd;animation:blink 1.3s infinite}
    @keyframes blink{50%{opacity:.25;transform:scale(.7)}}
    @keyframes badgePulse{50%{box-shadow:inset 0 0 22px rgba(255,65,176,.12),0 0 28px rgba(255,65,176,.14)}}

    .icon{width:118px;height:118px;margin:2px auto 21px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:52px;background:radial-gradient(circle,#27112a 48%,#100611 49%);border:4px solid #fff;
      outline:4px solid rgba(255,71,176,.65);box-shadow:0 0 0 10px rgba(255,71,176,.08),0 0 38px rgba(255,55,176,.55);
      animation:logoFloat 3s ease-in-out infinite;position:relative;overflow:hidden}
    .icon:before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,116,202,.22);animation:ring 2.5s linear infinite}
    .logo-icon img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
    @keyframes logoFloat{50%{transform:translateY(-7px) rotate(1deg)}}
    @keyframes ring{from{transform:scale(.94);opacity:.8}to{transform:scale(1.08);opacity:0}}

    h1{font-size:32px;line-height:1.05;font-weight:900;letter-spacing:-1.3px;margin-bottom:13px}
    h1 span{background:linear-gradient(90deg,#fff,#ffb8e2 38%,#ff4fb3 75%,#c875ff);background-size:200% auto;
      -webkit-background-clip:text;background-clip:text;color:transparent;animation:textShine 3s linear infinite}
    @keyframes textShine{to{background-position:200% center}}
    p{font-size:14px;color:#c8a9c0;line-height:1.7;margin-bottom:24px}

    .features{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 22px}
    .feature{padding:13px 6px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,126,205,.13);transition:.3s ease}
    .feature:hover{transform:translateY(-4px);border-color:rgba(255,126,205,.4);background:rgba(255,76,178,.08);box-shadow:0 10px 25px rgba(255,57,174,.1)}
    .feature b{display:block;font-size:16px;font-weight:900;background:linear-gradient(90deg,#ff9cdb,#ff4fb3,#bd78ff);
      -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:3px}
    .feature span{font-size:8px;color:#a98aa3;font-weight:800;letter-spacing:1px}

    .tg-btn{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
      min-height:64px;padding:17px 20px;border-radius:19px;color:#fff;font-size:18px;font-weight:900;text-decoration:none;overflow:hidden;
      background:linear-gradient(105deg,#ff4fb3,#ff65bd 45%,#b85cff);border:1px solid rgba(255,255,255,.42);
      box-shadow:0 12px 35px rgba(255,57,173,.34),inset 0 1px 0 rgba(255,255,255,.42);
      transition:transform .25s ease,box-shadow .25s ease;animation:buttonPulse 2.5s ease-in-out infinite}
    .tg-btn:before{content:"";position:absolute;z-index:-1;top:0;left:-80%;width:55%;height:100%;transform:skewX(-22deg);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.48),transparent);animation:shine 2.8s infinite}
    @keyframes shine{0%{left:-80%}55%,100%{left:140%}}
    @keyframes buttonPulse{50%{box-shadow:0 15px 45px rgba(255,57,173,.48),0 0 22px rgba(190,76,255,.18),inset 0 1px 0 rgba(255,255,255,.42)}}
    .tg-btn:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 18px 48px rgba(255,57,173,.55),0 0 30px rgba(190,76,255,.24)}
    .tg-btn:active{transform:scale(.975)}
    .tg-btn svg{width:28px;height:28px;flex-shrink:0}

    .footer{margin-top:19px;padding-top:18px;border-top:1px solid rgba(255,125,207,.1);color:#80677b;font-size:10px;line-height:1.7}

    .petal-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:20}
    .petal{position:absolute;top:-50px;width:14px;height:10px;border-radius:80% 15% 80% 15%;
      background:linear-gradient(135deg,#ffb5df,#ff4fb3);box-shadow:0 0 10px rgba(255,92,184,.38);
      opacity:.78;animation:petalFall linear forwards}
    .petal:nth-child(3n){width:11px;height:8px;background:linear-gradient(135deg,#ffd0ec,#ff72c4)}
    .petal:nth-child(4n){width:17px;height:11px;background:linear-gradient(135deg,#f6b4ff,#c875ff)}
    @keyframes petalFall{
      0%{transform:translate3d(0,-60px,0) rotate(0);opacity:0}8%{opacity:.8}
      25%{transform:translate3d(35px,25vh,0) rotate(110deg)}
      50%{transform:translate3d(-25px,52vh,0) rotate(230deg)}
      75%{transform:translate3d(45px,78vh,0) rotate(320deg)}
      100%{transform:translate3d(-20px,112vh,0) rotate(450deg);opacity:0}
    }
    @media(max-width:390px){body{padding:10px}.container{padding:25px 17px 22px;border-radius:25px}
      h1{font-size:29px}.icon{width:105px;height:105px;font-size:47px}.tg-btn{font-size:16px;min-height:60px}}
  </style>
